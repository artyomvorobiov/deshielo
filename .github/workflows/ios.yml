name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Проверка рецептов (JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: python3 tools/validate_content.py

  build:
    name: Сборка и тесты (Xcode)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      screenshots: ${{ steps.screenshots.outputs.names }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Выбор симулятора
        id: sim
        run: |
          xcrun simctl list runtimes || true
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rts[-1]["identifier"] if rts else "")
          ')
          echo "Среда iOS: ${RUNTIME:-нет}"
          UDID=""
          if [ -n "$RUNTIME" ]; then
            UDID=$(RUNTIME="$RUNTIME" xcrun simctl list devices available -j | RUNTIME="$RUNTIME" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
          phones = [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')
            if [ -z "$UDID" ]; then
              DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = [d for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone")]
          print(types[-1]["identifier"] if types else "")
          ')
              echo "Создаю симулятор $DEVTYPE"
              UDID=$(xcrun simctl create "CI iPhone" "$DEVTYPE" "$RUNTIME" || true)
            fi
          fi
          echo "Выбран симулятор: ${UDID:-нет (только сборка)}"
          echo "id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Сборка и тесты
        env:
          SIM_ID: ${{ steps.sim.outputs.id }}
          # UI-тест сохраняет сюда скриншоты экранов (см. DeshieloUITests/ScreenshotTests.swift).
          TEST_RUNNER_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: |
          set +e
          if [ -n "$SIM_ID" ]; then
            ACTION=test
            DESTINATION="id=$SIM_ID"
          else
            ACTION=build-for-testing
            DESTINATION="generic/platform=iOS Simulator"
          fi
          echo "Действие: $ACTION, destination: $DESTINATION"
          xcodebuild "$ACTION" \
            -project Deshielo.xcodeproj \
            -scheme Deshielo \
            -destination "$DESTINATION" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          STATUS=$?
          echo "::group::Ошибки компиляции"
          grep -E "(error|fatal error):" xcodebuild.log | sort -u | head -300
          echo "::endgroup::"
          echo "::group::Предупреждения"
          grep -E "warning:" xcodebuild.log | grep -v "/Library/Developer/" | sort -u | head -150
          echo "::endgroup::"
          echo "::group::Упавшие тесты"
          grep -E "(error: -\[|Test Case .* failed|XCTAssert)" xcodebuild.log | head -100
          echo "::endgroup::"
          tail -n 60 xcodebuild.log
          exit $STATUS

      - name: Лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Сбор скриншотов
        id: screenshots
        if: always()
        run: |
          mkdir -p screenshots
          # Если тест не смог записать файлы сам, достаём скриншоты из отчёта о тестах.
          if [ -z "$(ls -A screenshots)" ] && [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/attachments || true
            python3 - <<'EOF' || true
          import json, pathlib, shutil
          root = pathlib.Path("build/attachments")
          manifest = root / "manifest.json"
          if manifest.exists():
              for test in json.loads(manifest.read_text()):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                      stem = name.split("_")[0]
                      shutil.copy(root / item["exportedFileName"], f"screenshots/{stem}.png")
          EOF
          fi
          ls -la screenshots
          NAMES=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(p.stem for p in pathlib.Path("screenshots").glob("*.png"))))')
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"

      - name: Скриншоты экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # Временный шаг для визуальной проверки: каждый скриншот печатается в лог отдельной задачи.
  screenshot-log:
    name: Скриншот ${{ matrix.shot }}
    needs: build
    if: always() && needs.build.outputs.screenshots != '' && needs.build.outputs.screenshots != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.build.outputs.screenshots) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Печать
        env:
          SHOT: ${{ matrix.shot }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python - <<'EOF'
          import base64, io, os
          from PIL import Image
          name = os.environ["SHOT"]
          image = Image.open(f"screenshots/{name}.png").convert("RGB")
          width = 390
          image = image.resize((width, round(image.height * width / image.width)), Image.LANCZOS)
          buffer = io.BytesIO()
          image.save(buffer, "WEBP", quality=62, method=6)
          print(f"SHOT {name} {len(buffer.getvalue())} {base64.b64encode(buffer.getvalue()).decode()}")
          EOF
